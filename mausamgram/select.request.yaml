# Mausamgram: OAN /select -> the provider's own request.
#
# The provider takes a point as two query parameters. The step resolved that
# point out of the Beckn payload before this ran and left it in _local, so all
# this mapping does is name the fields the way the provider wants them.
#
# The filename's first segment is the action this serves. The mapper checks it
# against the request's own context.action and refuses a mismatch, which is what
# stops a confirm being served by a select mapping.
expression: |
  {
    "lat": _local.lat,
    "lon": _local.lon
  }
